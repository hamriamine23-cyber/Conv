<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="¥€ Convert" />
  <title>¥ ⇄ € Convertisseur</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0d1a;
      --surface: #13132b;
      --card: #1a1a35;
      --border: rgba(255,255,255,0.07);
      --accent-jpy: #e8c547;
      --accent-eur: #7eb8f7;
      --text: #f0f0f8;
      --muted: #6b6b8a;
      --input-bg: #0a0a18;
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      overflow: hidden;
      position: relative;
    }

    /* Background orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(232,197,71,0.12), transparent 70%);
      top: -80px; left: -80px;
    }
    body::after {
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(126,184,247,0.10), transparent 70%);
      bottom: -60px; right: -60px;
    }

    .wrapper {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .title-jpy { color: var(--accent-jpy); }
    .title-sep { color: var(--muted); margin: 0 6px; }
    .title-eur { color: var(--accent-eur); }

    .rate-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 5px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .rate-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.4s;
    }
    .rate-dot.live { background: #4ade80; box-shadow: 0 0 6px #4ade8088; }
    .rate-dot.error { background: #f87171; }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Field */
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 0;
    }
    .field:first-child { padding-top: 0; }
    .field:last-child { padding-bottom: 0; }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .currency-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .currency-flag {
      font-size: 1.3rem;
      line-height: 1;
    }
    .clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.75rem;
      font-family: 'DM Mono', monospace;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }
    .clear-btn:hover { color: var(--text); background: var(--border); }

    .input-row {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .input-row:focus-within { border-color: rgba(255,255,255,0.2); }
    .input-row.jpy:focus-within { border-color: var(--accent-jpy); }
    .input-row.eur:focus-within { border-color: var(--accent-eur); }

    .currency-symbol {
      padding: 0 14px;
      font-family: 'DM Mono', monospace;
      font-size: 1.1rem;
      font-weight: 500;
      flex-shrink: 0;
    }
    .jpy .currency-symbol { color: var(--accent-jpy); }
    .eur .currency-symbol { color: var(--accent-eur); }

    input[type="number"] {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 1.4rem;
      font-weight: 500;
      padding: 14px 14px 14px 0;
      width: 100%;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input::placeholder { color: var(--muted); }

    /* Divider swap */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 0;
      position: relative;
    }
    .divider::before {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: var(--border);
    }
    .swap-btn {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 36px; height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      transition: color 0.2s, border-color 0.2s, transform 0.3s;
    }
    .swap-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .swap-btn:active { transform: rotate(180deg); }

    /* Quick amounts */
    .quick-section {
      margin-top: 20px;
    }
    .quick-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .quick-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      padding: 10px 4px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      line-height: 1.3;
    }
    .quick-btn:hover { background: #222244; border-color: rgba(255,255,255,0.15); }
    .quick-btn:active { transform: scale(0.95); }
    .quick-btn small { display: block; color: var(--muted); font-size: 0.65rem; }

    /* Footer */
    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.68rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      line-height: 1.6;
    }
    footer a { color: var(--muted); text-decoration: none; }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .wrapper { animation: fadeIn 0.5s ease both; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .loading { animation: pulse 1.2s ease infinite; }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>
        <span class="title-jpy">¥</span>
        <span class="title-sep">⇄</span>
        <span class="title-eur">€</span>
      </h1>
      <div class="rate-badge">
        <span class="rate-dot" id="rateDot"></span>
        <span id="rateLabel" class="loading">Chargement…</span>
      </div>
    </header>

    <div class="card">
      <div class="field jpy">
        <div class="field-header">
          <div class="currency-label">
            <span class="currency-flag">🇯🇵</span> Yen japonais
          </div>
          <button class="clear-btn" onclick="clearAll()">Effacer</button>
        </div>
        <div class="input-row jpy">
          <span class="currency-symbol">¥</span>
          <input type="number" id="jpyInput" placeholder="0" inputmode="decimal" />
        </div>
      </div>

      <div class="divider">
        <button class="swap-btn" onclick="swapFocus()" title="Inverser">⇅</button>
      </div>

      <div class="field eur">
        <div class="field-header">
          <div class="currency-label">
            <span class="currency-flag">🇪🇺</span> Euro
          </div>
        </div>
        <div class="input-row eur">
          <span class="currency-symbol">€</span>
          <input type="number" id="eurInput" placeholder="0" inputmode="decimal" />
        </div>
      </div>
    </div>

    <div class="quick-section">
      <div class="quick-label">Montants rapides ¥</div>
      <div class="quick-grid" id="quickGrid"></div>
    </div>

    <footer>
      Taux : Frankfurter API (BCE) · Mis à jour à l'ouverture<br/>
      <span id="lastUpdate"></span>
    </footer>
  </div>

  <script>
    let rate = null; // 1 EUR = X JPY
    let activeInput = 'jpy';

    const jpyInput = document.getElementById('jpyInput');
    const eurInput = document.getElementById('eurInput');
    const rateLabel = document.getElementById('rateLabel');
    const rateDot = document.getElementById('rateDot');
    const lastUpdate = document.getElementById('lastUpdate');

    const QUICK_AMOUNTS = [500, 1000, 5000, 10000, 20000, 50000, 100000, 500000];

    const CACHE_KEY = 'jpy_eur_rate';
    const CACHE_TS_KEY = 'jpy_eur_ts';

    function applyRate(r, fromCache) {
      rate = r;
      rateLabel.textContent = `1 € = ${rate.toFixed(2)} ¥`;
      rateLabel.classList.remove('loading');
      if (fromCache) {
        rateDot.style.background = '#facc15';
        const ts = localStorage.getItem(CACHE_TS_KEY);
        lastUpdate.textContent = `Taux en cache · ${ts || '—'}`;
      } else {
        rateDot.classList.add('live');
        const ts = new Date().toLocaleDateString('fr-FR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
        localStorage.setItem(CACHE_KEY, r);
        localStorage.setItem(CACHE_TS_KEY, ts);
        lastUpdate.textContent = `Données live · ${ts}`;
      }
      buildQuickGrid();
    }

    async function fetchRate() {
      // Tentative 1 : open.er-api.com (pas de CORS)
      const APIs = [
        async () => {
          const r = await fetch('https://open.er-api.com/v6/latest/EUR');
          const d = await r.json();
          if (d.result !== 'success') throw new Error('API error');
          return d.rates.JPY;
        },
        // Tentative 2 : exchangerate.host
        async () => {
          const r = await fetch('https://api.exchangerate.host/latest?base=EUR&symbols=JPY');
          const d = await r.json();
          return d.rates.JPY;
        }
      ];

      for (const api of APIs) {
        try {
          const r = await api();
          if (r && r > 0) { applyRate(r, false); return; }
        } catch(_) {}
      }

      // Fallback : cache localStorage
      const cached = parseFloat(localStorage.getItem(CACHE_KEY));
      if (cached && cached > 0) {
        applyRate(cached, true);
      } else {
        rateLabel.textContent = 'Hors ligne – taux indispo';
        rateLabel.classList.remove('loading');
        rateDot.classList.add('error');
      }
    }

    function buildQuickGrid() {
      const grid = document.getElementById('quickGrid');
      grid.innerHTML = '';
      QUICK_AMOUNTS.forEach(jpy => {
        const eur = rate ? (jpy / rate).toFixed(2) : '—';
        const btn = document.createElement('button');
        btn.className = 'quick-btn';
        btn.innerHTML = `¥${jpy >= 1000 ? (jpy/1000)+'k' : jpy}<small>${eur}€</small>`;
        btn.onclick = () => {
          jpyInput.value = jpy;
          convert('jpy');
        };
        grid.appendChild(btn);
      });
    }

    function convert(from) {
      if (!rate) return;
      if (from === 'jpy') {
        const jpy = parseFloat(jpyInput.value);
        eurInput.value = isNaN(jpy) ? '' : (jpy / rate).toFixed(2);
      } else {
        const eur = parseFloat(eurInput.value);
        jpyInput.value = isNaN(eur) ? '' : Math.round(eur * rate);
      }
    }

    jpyInput.addEventListener('input', () => convert('jpy'));
    eurInput.addEventListener('input', () => convert('eur'));
    jpyInput.addEventListener('focus', () => activeInput = 'jpy');
    eurInput.addEventListener('focus', () => activeInput = 'eur');

    function clearAll() {
      jpyInput.value = '';
      eurInput.value = '';
      jpyInput.focus();
    }

    function swapFocus() {
      if (activeInput === 'jpy') {
        eurInput.focus();
        activeInput = 'eur';
      } else {
        jpyInput.focus();
        activeInput = 'jpy';
      }
    }

    fetchRate();
  </script>
</body>
</html>
